fragment CourseSection on CourseSection {
  id
  denomination
  is_published
  rank
  items {
    ... on Lesson {
      id
      itemId
      denomination
      duration
      is_published
      components {
        ... on TextContent {
          ...TextContentComponent
        }
        ... on VideoContent {
          ...VideoContentComponent
        }
        ... on YouTubeContent {
          ...YouTubeContentComponent
        }
        ... on AudioContent {
          ...AudioContentComponent
        }
        ... on DocumentContent {
          ...DocumentContentComponent
        }
        ... on EmbedContent {
          ...EmbedContentComponent
        }
        ... on ImageContent {
          ...ImageContentComponent
        }
      }
    }
    ... on Quiz {
      id
      itemId
      denomination
      is_published
      passing_score
      max_attempts
      navigation_mode
      questions_per_page
      show_correct_answers
      feedback_passed
      feedback_failed
      passed
      attempts {
        id
        attempt_number
        status
        score
        passed
        timed_out
        submitted_at
      }
    }
  }
}

fragment CourseReview on CourseReview {
  id
  rating
  review
  created_at
  reviewer {
    id
    first_name
    last_name
    avatar_url
  }
  isEditable
}

fragment Course on Course {
  id
  denomination
  slug
  subtitle
  description
  level
  image
  external_resource_link
  start_date
  end_date
  language
  updated_at
  created_at
  status
  subjects {
    id
    denomination
  }
  objectives {
    id
    objective
  }
  requirements {
    id
    requirement
  }
  sections {
    ...CourseSection
  }
  rating
  ratingsCount
  reviews {
    ...CourseReview
  }
  viewerReview {
    ...CourseReview
  }
  instructor {
    id
    first_name
    last_name
    avatar_url
    description
    isFollowed
    isAllowedToFollow
  }
  participationCount
}

query Course($slug: String!) {
  course(slug: $slug) {
    ...Course
  }
}

mutation UpdateCourseStatus($courseStatusInput: CourseStatusInput!) {
  updateCourseStatus(courseStatusInput: $courseStatusInput) {
    success
    errors {
      message
    }
    course {
      id
      status
    }
  }
}

mutation RateCourse($ratingInfo: RateCourse!) {
  rateCourse(ratingInfo: $ratingInfo) {
    success
    errors {
      message
    }
    course {
      reviews {
        ...CourseReview
      }
      rating
    }
  }
}

mutation DeleteCourseRating($ratingInfo: DeleteCourseRatingInput!) {
  deleteCourseRating(ratingInfo: $ratingInfo) {
    success
    errors {
      message
    }
  }
}

mutation FollowTeacher($followTeacherInfo: FollowTeacherInput!) {
  followTeacher(followTeacherInfo: $followTeacherInfo) {
    success
    errors {
      message
    }
    isFollowing
  }
}

mutation UpdateContentComponentProgress($progressInput: UpdateContentComponentProgressInput!) {
  updateContentComponentProgress(progressInput: $progressInput) {
    success
    errors {
      message
    }
    contentComponentProgress {
      id
      content_component_id
      is_completed
    }
  }
}
