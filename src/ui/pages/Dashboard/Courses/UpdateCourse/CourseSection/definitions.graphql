fragment EditableLesson on Lesson {
  id
  itemId
  denomination
  duration
  is_published
  components {
    ... on TextContent {
      ...TextContentComponent
    }
    ... on VideoContent {
      ...VideoContentComponent
    }
    ... on YouTubeContent {
      ...YouTubeContentComponent
    }
    ... on AudioContent {
      ...AudioContentComponent
    }
    ... on DocumentContent {
      ...DocumentContentComponent
    }
    ... on EmbedContent {
      ...EmbedContentComponent
    }
    ... on ImageContent {
      ...ImageContentComponent
    }
  }
}

fragment EditableQuiz on Quiz {
  id
  itemId
  denomination
  is_published
  passing_score
  max_attempts
  shuffle_questions
  shuffle_answers
  navigation_mode
  questions_per_page
  show_correct_answers
  time_limit_minutes
  feedback_passed
  feedback_failed
  questions {
    id
    prompt
    question_type
    points
    rank
    media_url
    media_type
    hint
    difficulty
    learning_objective
    feedback_correct
    feedback_incorrect
    answers {
      id
      denomination
      image_url
      is_correct
      rank
    }
  }
}

fragment Section on CourseSection {
  id
  denomination
  items {
    ... on Lesson {
      ...EditableLesson
    }
    ... on Quiz {
      ...EditableQuiz
    }
  }
}

fragment EditableCourseSectionItem on Course {
  id
  sections {
    ...Section
  }
}

query EditableCourseSection($id: ID!) {
  editableCourse(id: $id) {
    ...EditableCourseSectionItem
  }
}

mutation CreateLesson($lessonInfo: LessonInfoInput!) {
  createLesson(lessonInfo: $lessonInfo) {
    success
    errors {
      message
    }
    lesson {
      id
      denomination
      duration
      is_published
    }
  }
}

mutation UpdateLesson($lessonInfo: UpdateLessonInfoInput!) {
  updateLesson(lessonInfo: $lessonInfo) {
    success
    errors {
      message
    }
    lesson {
      id
      denomination
      duration
      is_published
    }
  }
}

mutation CreateQuiz($quizInfo: QuizInfoInput!) {
  createQuiz(quizInfo: $quizInfo) {
    success
    errors {
      message
    }
    quiz {
      id
      itemId
      denomination
      is_published
    }
  }
}

mutation UpdateQuiz($quizInfo: UpdateQuizInfoInput!) {
  updateQuiz(quizInfo: $quizInfo) {
    success
    errors {
      message
    }
    quiz {
      id
      itemId
      denomination
      is_published
    }
  }
}

mutation DeleteCourseSectionItem($id: ID!) {
  deleteCourseSectionItem(id: $id) {
    success
    errors {
      message
    }
  }
}

mutation UpdateCourseSectionItemRanks($sectionItemRanks: [UpdateCourseSectionItemRankInput!]!) {
  updateCourseSectionItemRanks(sectionItemRanks: $sectionItemRanks) {
    success
    errors {
      message
    }
  }
}
