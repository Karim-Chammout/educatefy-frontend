mutation DeleteContentComponent($componentId: ID!, $componentType: ComponentType!) {
  deleteContentComponent(componentId: $componentId, componentType: $componentType) {
    success
    errors {
      message
    }
  }
}

mutation UpdateContentComponentRanks($componentRanks: [UpdateContentComponentRankInput!]!) {
  updateContentComponentRanks(componentRanks: $componentRanks) {
    success
    errors {
      message
    }
  }
}

mutation CreateContentComponent(
  $baseComponentInfo: ContentComponentBaseInput!
  $textContent: TextContentInput
  $videoContent: VideoContentInput
  $youtubeContent: YouTubeContentInput
  $audioContent: AudioContentInput
  $documentContent: DocumentContentInput
  $embedContent: EmbedContentInput
  $imageContent: ImageContentInput
) {
  createContentComponent(
    baseComponentInfo: $baseComponentInfo
    textContent: $textContent
    videoContent: $videoContent
    youtubeContent: $youtubeContent
    audioContent: $audioContent
    documentContent: $documentContent
    embedContent: $embedContent
    imageContent: $imageContent
  ) {
    success
    errors {
      message
    }
    component {
      ... on TextContent {
        ...TextContentComponent
      }
      ... on VideoContent {
        ...VideoContentComponent
      }
      ... on YouTubeContent {
        ...YouTubeContentComponent
      }
      ... on AudioContent {
        ...AudioContentComponent
      }
      ... on DocumentContent {
        ...DocumentContentComponent
      }
      ... on EmbedContent {
        ...EmbedContentComponent
      }
      ... on ImageContent {
        ...ImageContentComponent
      }
    }
  }
}

mutation UpdateContentComponent(
  $baseComponentInfo: UpdateContentComponentBaseInput!
  $textContent: TextContentInput
  $videoContent: VideoContentInput
  $youtubeContent: YouTubeContentInput
  $audioContent: AudioContentInput
  $documentContent: DocumentContentInput
  $embedContent: EmbedContentInput
  $imageContent: ImageContentInput
) {
  updateContentComponent(
    baseComponentInfo: $baseComponentInfo
    textContent: $textContent
    videoContent: $videoContent
    youtubeContent: $youtubeContent
    audioContent: $audioContent
    documentContent: $documentContent
    embedContent: $embedContent
    imageContent: $imageContent
  ) {
    success
    errors {
      message
    }
    component {
      ... on TextContent {
        ...TextContentComponent
      }
      ... on VideoContent {
        ...VideoContentComponent
      }
      ... on YouTubeContent {
        ...YouTubeContentComponent
      }
      ... on AudioContent {
        ...AudioContentComponent
      }
      ... on DocumentContent {
        ...DocumentContentComponent
      }
      ... on EmbedContent {
        ...EmbedContentComponent
      }
      ... on ImageContent {
        ...ImageContentComponent
      }
    }
  }
}
