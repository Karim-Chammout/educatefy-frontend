fragment Teacher on Teacher {
  id
  first_name
  last_name
  avatar_url
  description
  bio
  isFollowed
  isAllowedToFollow
  followersCount
  subjects {
    id
    denomination
  }
  socialLinks {
    id
    platform
    platformDisplayName
    userName
    displayName
    url
    isPrimary
  }
  courses {
    id
    denomination
    slug
    level
    image
    rating
    ratingsCount
    participationCount
    status
    progress {
      completedComponents
      totalComponents
      progressPercentage
      isCompleted
    }
  }
  programs {
    id
    denomination
    slug
    level
    image
    enrolledLearnersCount
    instructor {
      id
      first_name
      last_name
      avatar_url
    }
    currentVersion {
      courses {
        id
      }
    }
  }
}

query Instructor($id: ID!, $first: Int!, $offset: Int!, $type: ContentKind) {
  instructor(id: $id) {
    ...Teacher
    content(first: $first, offset: $offset, type: $type) {
      totalCount
      items {
        ... on Course {
          ...CatalogCourse
        }
        ... on Program {
          ...CatalogProgram
        }
      }
    }
  }
}
