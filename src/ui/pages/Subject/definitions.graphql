fragment SubjectContent on Subject {
  id
  denomination
  courses {
    id
    denomination
    slug
    level
    image
    rating
    participationCount
    status
    progress {
      completedComponents
      totalComponents
      progressPercentage
      isCompleted
    }
    instructor {
      first_name
      last_name
      avatar_url
    }
  }
  programs {
    id
    denomination
    slug
    level
    image
    enrolledLearnersCount
    instructor {
      first_name
      last_name
      avatar_url
    }
    currentVersion {
      courses {
        id
      }
    }
  }
}

query Subject($id: ID!) {
  subject(id: $id) {
    ...SubjectContent
  }
}
